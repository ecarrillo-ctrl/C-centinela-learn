# ==============================================================================
# eLearning AgroAmérica — Docker Compose OVERRIDE para desarrollo local
# Uso: docker compose --profile dev -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================

services:
  backend:
    environment:
      NODE_ENV: development
      JWT_EXPIRES_IN: 24h
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      DB_HOST: db
      DB_SID: XEPDB1
      DB_USE_SID: false
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/scripts:/app/scripts:ro
    command: node --watch src/server.js
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - frontend_node_modules:/app/node_modules

  mailhog:
    ports:
      - "8025:8025"
