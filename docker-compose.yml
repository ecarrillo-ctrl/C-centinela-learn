# ==============================================================================
# eLearning AgroAmérica — Docker Compose
# IMPORTANTE: Copie .env.example a .env y configure TODAS las variables antes
# de ejecutar docker compose up. Las variables sensibles NO tienen defaults.
# ==============================================================================

services:
  db:
    image: gvenzl/oracle-xe:21-slim
    container_name: centinela-oracledb
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${DB_USER:-ELEARNING}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    volumes:
      - oracledata:/opt/oracle/oradata
      - ./db/oracle:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - centinela-net
    expose:
      - "1521"
    ports:
      - "1521:1521"
    deploy:
      resources:
        limits:
          memory: 2G

  openldap:
    image: osixia/openldap:1.5.0
    container_name: centinela-ldap
    restart: unless-stopped
    profiles:
      - dev
    environment:
      LDAP_ORGANISATION: "AgroAmerica"
      LDAP_DOMAIN: "agroamerica.com"
      LDAP_ADMIN_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - centinela-net
    expose:
      - "389"
      - "636"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: centinela-mailhog
    restart: unless-stopped
    profiles:
      - dev
    networks:
      - centinela-net
    expose:
      - "1025"
      - "8025"

  minio:
    image: minio/minio:latest
    container_name: centinela-minio
    restart: unless-stopped
    profiles:
      - dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - centinela-net
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Crea el bucket automáticamente al iniciar (solo en dev)
  minio-init:
    image: minio/mc:latest
    container_name: centinela-minio-init
    profiles:
      - dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/${S3_BUCKET:-elearning-agroamerica-storage} --ignore-existing;
      mc anonymous set download local/${S3_BUCKET:-elearning-agroamerica-storage}/content;
      exit 0;
      "
    networks:
      - centinela-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: centinela-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-1521}
      DB_SID: ${DB_SID:-ORCL}
      DB_USER: ${DB_USER:-ELEARNING}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USE_SID: ${DB_USE_SID:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      LDAP_URL: ${LDAP_URL}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE}
      LDAP_PAGE_SIZE: ${LDAP_PAGE_SIZE:-500}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM}
      BASE_URL: ${BASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      # --- S3 Storage ---
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-elearning-agroamerica-storage}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
    volumes:
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - centinela-net
    expose:
      - "3000"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-production}
    container_name: centinela-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - centinela-net
    expose:
      - "5173"
    ports:
      - "5173:5173"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: centinela-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - centinela-net

networks:
  centinela-net:
    driver: bridge

volumes:
  oracledata:
  ldap_data:
  ldap_config:
  minio_data:
  backend_node_modules:
  frontend_node_modules:
